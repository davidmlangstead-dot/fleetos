name: One-shot dependency security autofix

on:
  push:
    paths:
      - .github/workflows/security-autofix.yml

permissions:
  contents: write

jobs:
  security-autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply compatible audit fixes
        run: pnpm audit --fix=update
      - name: Generate Prisma client
        run: pnpm --filter @fleetros/api exec prisma generate
      - name: Build after fixes
        run: pnpm build
      - name: Verify high severity vulnerabilities are gone
        run: pnpm audit --audit-level high
      - name: Commit verified dependency fixes
        run: |
          if git diff --quiet; then
            echo "No dependency changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml apps/*/package.json packages/*/package.json
          git commit -m "fix high severity dependency vulnerabilities"
          git push origin HEAD:main
