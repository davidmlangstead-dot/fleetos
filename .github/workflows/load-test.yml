name: Safe API load test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/load-test.mjs"
      - ".github/workflows/load-test.yml"

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run safe health-endpoint load test
        env:
          FLEETOS_API_URL: "https://fleetos-1.onrender.com"
          LOAD_TEST_PATH: "/health"
          LOAD_TEST_STAGES: "5,10,25,50"
          LOAD_TEST_STAGE_SECONDS: "8"
          LOAD_TEST_THINK_MS: "1000"
          LOAD_TEST_TIMEOUT_MS: "5000"
          LOAD_TEST_MAX_ERROR_RATE: "0.05"
          LOAD_TEST_MAX_P95_MS: "2000"
        run: node scripts/load-test.mjs
