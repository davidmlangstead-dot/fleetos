name: FleetOS Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fleetos-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fleetros/api exec prisma generate
      - run: pnpm build
      - name: Text encoding contract
        run: node scripts/check-text-encoding.mjs
      - name: Role policy contract
        run: node scripts/check-role-contract.mjs
      - name: Staff rollback safety contract
        run: node scripts/check-staff-rollback.mjs
      - name: Auth and browser hardening contract
        run: node scripts/check-auth-hardening.mjs
      - name: Web bundle performance budget
        run: node scripts/check-web-bundle.mjs
      - name: PWA installability contract
        run: node scripts/check-pwa.mjs

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runtime dependency vulnerability audit
        run: pnpm audit:deps
      - name: Build-tool dependency advisory
        continue-on-error: true
        run: pnpm audit:tooling

  production-assurance:
    runs-on: ubuntu-latest
    needs: build-and-contracts
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Production smoke test
        run: node scripts/smoke.mjs
      - name: Security perimeter test
        run: node scripts/security-smoke.mjs
      - name: Authenticated tenant isolation when configured
        env:
          FLEETOS_SECURITY_TOKEN_A: ${{ secrets.FLEETOS_SECURITY_TOKEN_A }}
          FLEETOS_SECURITY_TOKEN_B: ${{ secrets.FLEETOS_SECURITY_TOKEN_B }}
          FLEETOS_SECURITY_COMPANY_A: ${{ secrets.FLEETOS_SECURITY_COMPANY_A }}
          FLEETOS_SECURITY_COMPANY_B: ${{ secrets.FLEETOS_SECURITY_COMPANY_B }}
        run: |
          if [ -z "$FLEETOS_SECURITY_TOKEN_A" ] || [ -z "$FLEETOS_SECURITY_TOKEN_B" ] || [ -z "$FLEETOS_SECURITY_COMPANY_A" ] || [ -z "$FLEETOS_SECURITY_COMPANY_B" ]; then
            echo "Authenticated cross-tenant attack coverage is not configured in GitHub secrets; perimeter and tenant-selection contracts still run."
            exit 0
          fi
          node scripts/tenant-attack.mjs
      - name: Authenticated read load when configured
        env:
          FLEETOS_SECURITY_TOKEN_A: ${{ secrets.FLEETOS_SECURITY_TOKEN_A }}
          FLEETOS_SECURITY_COMPANY_A: ${{ secrets.FLEETOS_SECURITY_COMPANY_A }}
          FLEETOS_AUTH_LOAD_MAX_ERROR_RATE: "0.01"
          FLEETOS_AUTH_LOAD_MAX_P95_MS: "2500"
        run: |
          if [ -z "$FLEETOS_SECURITY_TOKEN_A" ] || [ -z "$FLEETOS_SECURITY_COMPANY_A" ]; then
            echo "Authenticated load coverage is not configured; skipping without masking public assurance."
            exit 0
          fi
          node scripts/authenticated-load.mjs
