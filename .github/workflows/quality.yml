name: FleetOS Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fleetros/api exec prisma generate
      - run: pnpm build
      - name: Web bundle performance budget
        run: node scripts/check-web-bundle.mjs
      - name: Dependency vulnerability audit
        run: pnpm audit:deps

  production-assurance:
    runs-on: ubuntu-latest
    needs: build-and-dependencies
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Production smoke test
        run: node scripts/smoke.mjs
      - name: Security perimeter test
        run: node scripts/security-smoke.mjs
      - name: Authenticated tenant isolation
        run: node scripts/tenant-attack.mjs
        env:
          FLEETOS_SECURITY_TOKEN_A: ${{ secrets.FLEETOS_SECURITY_TOKEN_A }}
          FLEETOS_SECURITY_TOKEN_B: ${{ secrets.FLEETOS_SECURITY_TOKEN_B }}
          FLEETOS_SECURITY_COMPANY_A: ${{ secrets.FLEETOS_SECURITY_COMPANY_A }}
          FLEETOS_SECURITY_COMPANY_B: ${{ secrets.FLEETOS_SECURITY_COMPANY_B }}
      - name: Authenticated read load
        run: node scripts/authenticated-load.mjs
        env:
          FLEETOS_SECURITY_TOKEN_A: ${{ secrets.FLEETOS_SECURITY_TOKEN_A }}
          FLEETOS_SECURITY_COMPANY_A: ${{ secrets.FLEETOS_SECURITY_COMPANY_A }}
          FLEETOS_AUTH_LOAD_MAX_ERROR_RATE: "0.01"
          FLEETOS_AUTH_LOAD_MAX_P95_MS: "2500"
